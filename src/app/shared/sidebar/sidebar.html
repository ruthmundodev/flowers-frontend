<!-- Botón hamburguesa — solo visible en móvil -->
<button class="hamburger-btn" (click)="mobileOpen = true" aria-label="Abrir menú">
  <i class="ti ti-menu-2"></i>
</button>

<!-- Backdrop para cerrar el drawer -->
<div class="sidebar-backdrop" [class.sidebar-backdrop--visible]="mobileOpen"
     (click)="mobileOpen = false"></div>

<aside class="sidebar" [class.sidebar--open]="mobileOpen">
  <div class="sidebar-brand">
    <div class="brand-dot"></div>
    <span class="brand-name" [title]="nombreUsuario">{{ nombreUsuario }}</span>
    <button class="logout-btn close-mobile-btn" (click)="mobileOpen = false"
            aria-label="Cerrar menú" title="Cerrar menú">
      <i class="ti ti-x"></i>
    </button>
    <app-campana />
    <button class="logout-btn" (click)="tema.alternar()"
            [title]="tema.esOscuro() ? 'Modo claro' : 'Modo oscuro'"
            aria-label="Cambiar tema">
      <i class="ti" [class.ti-moon]="!tema.esOscuro()" [class.ti-sun]="tema.esOscuro()"></i>
    </button>
    <button class="logout-btn" (click)="logout()" title="Cerrar sesión" aria-label="Cerrar sesión">
      <i class="ti ti-logout"></i>
    </button>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-group-label">General</div>
    <a class="nav-item" routerLink="/dashboard" routerLinkActive="active">
      <i class="ti ti-layout-dashboard"></i>
      <span>Dashboard</span>
    </a>
    <a class="nav-item" routerLink="/inventario" routerLinkActive="active" *ngIf="puedeVer('Inventario')">
      <i class="ti ti-box"></i>
      <span>Inventario</span>
      <span class="nav-badge nav-badge--warn" *ngIf="stockBajo() > 0"
            [title]="stockBajo() + ' variedad(es) con stock bajo'">{{ stockBajo() }}</span>
    </a>
    <a class="nav-item" routerLink="/quimico" routerLinkActive="active" *ngIf="puedeVer('Quimico')">
      <i class="ti ti-flask"></i>
      <span>Químicos</span>
    </a>
    <a class="nav-item" routerLink="/temporada" routerLinkActive="active" *ngIf="puedeVer('Temporada')">
      <i class="ti ti-calendar"></i>
      <span>Temporadas</span>
    </a>
    <a class="nav-item" routerLink="/siembras" routerLinkActive="active" *ngIf="puedeVer('Temporada')">
      <i class="ti ti-seeding"></i>
      <span>Siembras</span>
    </a>
    <a class="nav-item" routerLink="/parcelas" routerLinkActive="active" *ngIf="puedeVer('Temporada')">
      <i class="ti ti-layout-grid"></i>
      <span>Parcelas</span>
    </a>
    <a class="nav-item" routerLink="/anuncios" routerLinkActive="active" *ngIf="puedeVer('Anuncios')">
      <i class="ti ti-speakerphone"></i>
      <span>Anuncios</span>
    </a>

    <!-- Reportes — colapsable, cerrado por defecto -->
    <button class="nav-group-label nav-group-label--toggle"
            (click)="reportesAbierto = !reportesAbierto">
      Reportes
      <i class="ti ti-chevron-right nav-chevron" [class.nav-chevron--open]="reportesAbierto"></i>
    </button>
    <div class="nav-group-items" [class.nav-group-items--open]="reportesAbierto">
      <a class="nav-item" routerLink="/rendimientos" routerLinkActive="active" *ngIf="puedeVer('Rendimientos')">
        <i class="ti ti-chart-line"></i>
        <span>Rendimientos</span>
      </a>
      <a class="nav-item" routerLink="/exportar" routerLinkActive="active">
        <i class="ti ti-file-export"></i>
        <span>Exportar</span>
      </a>
    </div>

    <!-- Administración — colapsable, cerrado por defecto -->
    <ng-container *ngIf="esAdmin">
      <button class="nav-group-label nav-group-label--toggle"
              (click)="adminAbierto = !adminAbierto">
        Administración
        <i class="ti ti-chevron-right nav-chevron" [class.nav-chevron--open]="adminAbierto"></i>
      </button>
      <div class="nav-group-items" [class.nav-group-items--open]="adminAbierto">
        <a class="nav-item" routerLink="/usuarios" routerLinkActive="active">
          <i class="ti ti-users"></i>
          <span>Usuarios</span>
        </a>
        <a class="nav-item" routerLink="/invernaderos" routerLinkActive="active">
          <i class="ti ti-building-warehouse"></i>
          <span>Invernaderos</span>
        </a>
        <a class="nav-item" routerLink="/asignaciones" routerLinkActive="active">
          <i class="ti ti-user-cog"></i>
          <span>Asignaciones</span>
        </a>
      </div>
    </ng-container>
  </nav>

  <div class="sidebar-footer">
    <div class="inv-selector" #invWrapper>
      <button type="button"
              class="inv-trigger"
              #invTrigger
              (click)="toggleInvSelector()"
              (keydown)="onTriggerKeydown($event)"
              aria-haspopup="listbox"
              [attr.aria-expanded]="invSelectorOpen()"
              aria-label="Seleccionar invernadero">
        <span class="inv-trigger-icon"><i class="ti ti-building-warehouse"></i></span>
        <span class="inv-trigger-text">
          <span class="inv-trigger-label">Invernadero</span>
          <span class="inv-trigger-value">
            {{ invActivo().label }}<ng-container *ngIf="invActivo().sub"> · {{ invActivo().sub }}</ng-container>
          </span>
        </span>
        <i class="ti ti-selector inv-trigger-chevron" [class.inv-trigger-chevron--open]="invSelectorOpen()"></i>
      </button>

      <div class="inv-popover"
           [class.open]="invSelectorOpen()"
           role="listbox"
           tabindex="-1"
           aria-label="Invernaderos"
           (keydown)="onListboxKeydown($event)">
        <div class="inv-popover-list">
          <div *ngFor="let opt of invOpciones(); let i = index"
               class="inv-option"
               [class.inv-option--active]="invernaderoActivoId() === opt.id"
               [class.inv-option--highlighted]="highlightedIndex() === i"
               role="option"
               tabindex="-1"
               [attr.aria-selected]="invernaderoActivoId() === opt.id"
               (click)="seleccionarInvernadero(opt.id)"
               (mouseenter)="highlightedIndex.set(i)">
            <i class="ti inv-option-icon" [class.ti-layout-grid]="opt.id === null" [class.ti-building-warehouse]="opt.id !== null"></i>
            <span class="inv-option-text">
              <ng-container *ngIf="opt.id === null; else conNumero">Todos los invernaderos</ng-container>
              <ng-template #conNumero>
                <span class="inv-option-chip">#{{ opt.numero }}</span>
                <span class="inv-option-name">{{ opt.nombreCultivo }}</span>
              </ng-template>
            </span>
            <i class="ti ti-check inv-option-check" *ngIf="invernaderoActivoId() === opt.id"></i>
          </div>
        </div>
      </div>
    </div>
  </div>
</aside>
